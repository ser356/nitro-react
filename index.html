    <script>
      (() => {
        const parameters = new URLSearchParams(location.search);
        const cookie = name => document.cookie.split(';').map(part => part.trim()).find(part => part.startsWith(`${ name }=`))?.split('=').slice(1).join('=');
        const appearances = ['original', 'retro', 'fanzine', 'arcade', 'aero', 'metalheart'];
        const requestedAppearance = parameters.get('appearance') || cookie('pieslibres_appearance');
        const requestedTheme = parameters.get('theme') || cookie('pieslibres_theme');
        const appearance = appearances.includes(requestedAppearance) ? requestedAppearance : 'original';
        const theme = requestedTheme === 'purple' ? 'purple' : 'pink';
        const defaultReturn = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://localhost/' : 'https://www.pieslibres.org/';
        let returnUrl = defaultReturn;

        try {
          const candidate = new URL(parameters.get('return') || defaultReturn);
          const production = candidate.protocol === 'https:' && ['pieslibres.org', 'www.pieslibres.org'].includes(candidate.hostname);
          const local = ['localhost', '127.0.0.1'].includes(candidate.hostname);
          if(production || local) returnUrl = candidate.href;
        } catch {}

        document.documentElement.dataset.appearance = appearance;
        document.documentElement.classList.toggle('theme-purple', theme === 'purple');
        window.PiesLibresHotelContext = { appearance, theme, returnUrl };
      })();
    </script>

    <script>
      var NitroConfig;
      document.getElementById('return-button').href = window.PiesLibresHotelContext.returnUrl;
      const accountDialog = document.getElementById('account-dialog');
      const accountButton = document.getElementById('account-button');
      const accountButtonText = accountButton.querySelector('span');
      const accountClose = document.getElementById('account-close');
      const accountTitle = document.getElementById('account-title');
      const accountCopy = document.getElementById('account-copy');
      const accountTabs = document.getElementById('account-tabs');
      const loginTab = document.getElementById('login-tab');
      const registerTab = document.getElementById('register-tab');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const registeredView = document.getElementById('registered-view');
      const accountName = document.getElementById('account-name');
      const accountError = document.getElementById('account-error');
      const guestButton = document.getElementById('guest-button');
      const logoutButton = document.getElementById('logout-button');
      const errorMessages = {
        invalid_credentials: 'Usuario o contraseña incorrectos.',
        invalid_username: 'Usa entre 3 y 20 letras, números, puntos, guiones o guiones bajos.',
        invalid_password: 'La contraseña debe tener entre 12 y 128 caracteres.',
        username_taken: 'Ese usuario ya está ocupado.',
        already_registered: 'Este personaje ya tiene cuenta.',
        guest_session_required: 'La sesión de invitado caducó. Recarga e inténtalo de nuevo.',
        too_many_attempts: 'Demasiados intentos. Espera 15 minutos.',
      };
      let accountState = null;
      let firstVisitResolve = null;
      let choiceRequired = false;

      const requestJson = async (path, options = {}) => {
        const response = await fetch(path, { credentials: 'same-origin', ...options });
        const body = await response.json().catch(() => ({}));

        if(!response.ok) {
          const error = new Error(body.error || 'request_failed');
          error.code = body.error;
          throw error;
        }

        return body;
      };

      const setMode = mode => {
        const registering = mode === 'register';
        loginForm.hidden = registering;
        registerForm.hidden = !registering;
        registeredView.hidden = true;
        loginTab.setAttribute('aria-pressed', String(!registering));
        registerTab.setAttribute('aria-pressed', String(registering));
        accountTitle.textContent = registering ? 'Guarda tu personaje' : 'Vuelve a tu personaje';
        accountCopy.textContent = registering ? 'Crea tus datos de acceso sin perder nada de lo que ya has conseguido.' : 'Entra con tu cuenta y continúa exactamente donde lo dejaste.';
        accountError.textContent = '';
      };

      const openAccount = (mode, required = false) => {
        choiceRequired = required;
        accountClose.hidden = required;
        guestButton.hidden = !required;
        accountTabs.hidden = false;
        setMode(mode);
        if(!accountDialog.open) accountDialog.showModal();
      };

      const submitCredentials = async (form, path) => {
        const submit = form.querySelector('[type="submit"]');
        const data = Object.fromEntries(new FormData(form));
        submit.disabled = true;
        form.setAttribute('aria-busy', 'true');
        accountError.textContent = '';

        try {
          return await requestJson(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: data.username, password: data.password }),
          });
        } catch(error) {
          accountError.textContent = errorMessages[error.code] || 'No se pudo completar la operación. Inténtalo de nuevo.';
          return null;
        } finally {
          submit.disabled = false;
          form.removeAttribute('aria-busy');
        }
      };

      loginTab.addEventListener('click', () => setMode('login'));
      registerTab.addEventListener('click', () => setMode('register'));
      accountClose.addEventListener('click', () => accountDialog.close());
      accountDialog.addEventListener('cancel', event => {
        if(choiceRequired) event.preventDefault();
      });
      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        const session = await submitCredentials(loginForm, '/api/login');
        if(!session) return;
        if(firstVisitResolve) {
          firstVisitResolve(session);
          firstVisitResolve = null;
          choiceRequired = false;
          accountDialog.close();
        } else {
          location.reload();
        }
      });
      registerForm.addEventListener('submit', async event => {
        event.preventDefault();
        const data = new FormData(registerForm);
        if(data.get('password') !== data.get('confirmation')) {
          accountError.textContent = 'Las contraseñas no coinciden.';
          return;
        }
        if(firstVisitResolve) {
          try {
            await requestJson('/api/session', { method: 'POST' });
          } catch {
            accountError.textContent = 'No se pudo crear el personaje. Inténtalo de nuevo.';
            return;
          }
        }

        const session = await submitCredentials(registerForm, '/api/register');
        if(!session) return;

        if(firstVisitResolve) {
          firstVisitResolve(session);
          firstVisitResolve = null;
          choiceRequired = false;
          accountDialog.close();
        } else {
          location.reload();
        }
      });
      guestButton.addEventListener('click', async () => {
        guestButton.disabled = true;
        accountError.textContent = '';
        try {
          const session = await requestJson('/api/session', { method: 'POST' });
          firstVisitResolve(session);
          firstVisitResolve = null;
          choiceRequired = false;
          accountDialog.close();
        } catch {
          accountError.textContent = 'No se pudo crear el personaje. Inténtalo de nuevo.';
        } finally {
          guestButton.disabled = false;
        }
      });
      accountButton.addEventListener('click', () => {
        if(accountState.registered) {
          accountClose.hidden = false;
          guestButton.hidden = true;
          accountTabs.hidden = true;
          loginForm.hidden = true;
          registerForm.hidden = true;
          registeredView.hidden = false;
          accountTitle.textContent = 'Cuenta guardada';
          accountCopy.textContent = 'Tu progreso volverá contigo aunque cierres esta ventana.';
          accountName.textContent = accountState.username;
          accountError.textContent = '';
          accountDialog.showModal();
        } else {
          accountTabs.hidden = false;
          openAccount('register');
        }
      });
      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          await requestJson('/api/logout', { method: 'POST' });
          location.reload();
        } catch {
          accountError.textContent = 'No se pudo cerrar la sesión. Inténtalo de nuevo.';
          logoutButton.disabled = false;
        }
      });

      window.NitroConfigReady = (async () => {
        const parameters = new URLSearchParams(window.location.search);
        let ticket = parameters.get('sso');
        let session = null;

        if(!ticket) {
          const knownAccount = await requestJson('/api/account');
          session = knownAccount.known
            ? await requestJson('/api/session', { method: 'POST' })
            : await new Promise(resolve => {
                firstVisitResolve = resolve;
                openAccount('login', true);
              });
          ticket = session.ticket;
        }

        NitroConfig = {
          "config.urls": [ '/renderer-config.json', '/ui-config.json' ],
          "sso.ticket": ticket,
          "forward.type": (parameters.get('room') ? 2 : -1),
          "forward.id": (parameters.get('room') || 0),
          "friend.id": (parameters.get('friend') || 0),
        };

        if(parameters.has('sso')) {
          parameters.delete('sso');
          history.replaceState(null, '', `${ location.pathname }${ parameters.size ? `?${ parameters }` : '' }${ location.hash }`);
        }

        if(session) {
          accountState = session.account;
          accountButtonText.textContent = accountState.registered ? accountState.username : 'Guardar personaje';
          accountButton.title = accountState.registered ? accountState.username : 'Guardar personaje antes de 1 hora';
          accountButton.hidden = false;
        }

        document.body.classList.remove('account-pending');
      })();
    </script>
    <script type="module">
      window.NitroConfigReady
        .then(() => import('./src/index.tsx'))
        .catch(error => {
          document.body.classList.remove('account-pending');
          const root = document.getElementById('root');
          root.innerHTML = '<main style="display:grid;place-content:center;height:100%;padding:24px;text-align:center"><h1>Hotel no disponible</h1><p>No se pudo iniciar la sesión.</p><button type="button">Reintentar</button></main>';
          root.querySelector('button').addEventListener('click', () => location.reload());
          console.error(error);
        });
    </script>
  </body>
</html>
